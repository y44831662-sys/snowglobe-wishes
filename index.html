<style>

<script type="module">

const camera = byId('camera'), status = byId('status'), cue = byId('cue'), people = byId('people');
const guideCopy = {

      ['3 people · Left, center, right','Center: tree and star. Left: thumbs-up for Santa. Right: V sign for the reindeer. Finish with one snow gesture each.']
    ],
    layout:'The snowy scene fills the top 60% and the camera fills the bottom 40%. For three people, stand side by side and take a small step back so every face fits below the windowsill.',
    setupTitle:'Before you film',
    setup:'Open the page in Safari on your iPhone. Choose the automatic head count or select 1, 2, or 3. Tap “打开相机” (Open camera) and allow access. Set your phone upright and keep everyone’s face and one hand each in frame.',

    gestures:[
      '🎄 Tree | Point with your index finger and draw a big Z from top to bottom.',

const languageButtons = [...document.querySelectorAll('[data-language]')];
function showGuide(language) {
  const copy = guideCopy[language];
  byId('guideTitle').textContent = copy.title;
  byId('guideTitle').lang = language;
  const content = byId('guideContent');
  content.lang = language;
  content.innerHTML = `
    <h2>${copy.castTitle}</h2>
    <dl class="cast">${copy.cast.map(([title,body])=>`<div><dt>${title}</dt><dd>${body}</dd></div>`).join('')}</dl>
    <h2>${copy.setupTitle}</h2><p>${copy.layout}</p><p>${copy.setup}</p>
    <h2>${copy.gestureTitle}</h2><ol>${copy.gestures.map(gesture=>`<li>${gesture}</li>`).join('')}</ol>
    <p>${copy.record}</p>`;
  for (const button of languageButtons) button.setAttribute('aria-pressed',String(button.dataset.language === language));

for (const button of languageButtons) button.onclick = () => showGuide(button.dataset.language);
showGuide('zh-CN');

const version = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304';
const models = 'https://storage.googleapis.com/mediapipe-models';
const effects = new Map();
let hands, faces, stream, active = false, tracks = [], roundCount = 0;
let credits = new Set(), sparks = [], pendingStar = false, lastFrame = -1, lastFace = -Infinity, faceCount = 0;
let faceDetections = [], nextId = 0, observedCount = 0, countSince = 0, stableCount = 0;
const messages = {tree:'树长出来啦 · 比赞或比 V 来装饰',santa:'圣诞老人来送礼物了',deer:'小驯鹿找到圣诞树了',star:'星星亮啦 · 张掌向上撒雪',snow:'Merry Christmas!'};
const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
function trigger(name, point) {
  if (effects.has(name)) return;
  if (name === 'star' && !effects.has('tree')) {
    pendingStar = true;
    cue.textContent = '星星准备好了 · 先用食指画树';
    return;
  }
  effects.set(name, {time:performance.now(),point});
  cue.textContent = messages[name];
  if (name === 'tree') {
    roundCount = Number(people.value) || (faceCount === stableCount ? stableCount : faceCount) || 1;
    if (pendingStar) {
      pendingStar = false;
      trigger('star');
    }
  }
}
function reset() {
  effects.clear();
  tracks = [];
  credits.clear();
  sparks = [];
  pendingStar = false;
  roundCount = 0;
  cue.textContent = '伸出食指，画一个从上到下的 Z';
}
byId('reset').onclick = reset;
people.onchange = reset;
document.querySelectorAll('[data-effect]').forEach(button => button.onclick = () => trigger(button.dataset.effect));

function cover(point) {
  return {x:1-point.x,y:point.y};
}
function fingerUp(points, finger) {
  const [base,joint,tip] = [[2,3,4],[5,6,8],[9,10,12],[13,14,16],[17,18,20]][finger].map(i=>points[i]);
  return distance(tip,base) > 1.37*distance(joint,base) &&
    distance(tip,points[0]) > 1.09*distance(joint,points[0]);
}
function isZ(path) {
  if (path.length < 5) return false;
  const first = path[0], last = path[path.length-1];
  if (last.y-first.y < .095) return false;
  for (const direction of [1,-1]) {
    let peak = first.x * direction;
    let trough = Infinity;
    for (const point of path) {
      const x = point.x * direction;
      if (trough === Infinity) peak = Math.max(peak,x);
      if (peak-first.x*direction > .055 && peak-x > .075) trough = Math.min(trough,x);
      if (x-trough > .05) return true;
    }
  }
  return false;
}
function watch(track, points, now, face) {
  const wrist = points[0], tip = points[8], thumb = points[4];
  const palm = distance(wrist,points[9]);
  const [index,middle,ring,pinky] = [1,2,3,4].map(i=>fingerUp(points,i));
  const pinched = distance(thumb,tip) < .33*palm;
  let pose = '';
  if (index && middle && ring && pinky) pose = 'open';
  else if (pinched && !middle && !ring && !pinky) pose = 'star';
  else if (index && middle && !ring && !pinky && distance(tip,points[12]) > .26*palm) pose = 'deer';
  else if (index && !middle && !ring && !pinky) pose = 'point';
  else if (!index && !middle && !ring && !pinky && fingerUp(points,0) && thumb.y < points[5].y-.2*palm) pose = 'santa';
  const location = cover(tip);
  if (track.pose !== pose) {
    track.pose = pose;
    track.since = now;
    track.startY = wrist.y;
    track.path = [];
  }
  if (pose === 'point' && !effects.has('tree')) {
    track.path.push({...location,now});
    track.path = track.path.filter(p=>now-p.now<2200);
    if (isZ(track.path)) trigger('tree');
  }
  if ((pose === 'santa' || pose === 'deer') && now-track.since > 320) {
    const nearFace = !face || distance(tip,face) < Math.max(.14,face.width*1.75);
    if (pose === 'santa' || nearFace) trigger(pose,location);
  }
  if (pose === 'star' && now-track.since > 230) trigger('star',location);
  if (pose === 'open' && effects.has('star') && !effects.has('snow') && track.startY-wrist.y > .034) {
    const owner = track.faceId ?? track.id;
    if (credits.has(owner) || (roundCount > 1 && track.faceId == null)) return;
    credits.add(owner);
    sparks.push({point:cover(wrist),time:now});
    if (credits.size >= (roundCount || 1)) trigger('snow');
    else cue.textContent = '撒雪 ' + credits.size + ' / ' + roundCount;
  }
}
function updateFaces(now) {
  const boxes = faces.detectForVideo(video,now).detections.map(({boundingBox:b})=>({
    x:(b.originX+b.width/2)/video.videoWidth,
    y:(b.originY+b.height/2)/video.videoHeight,
    width:b.width/video.videoWidth
  }));
  const remaining = new Set(faceDetections);
  const next = boxes.map(box=>{
    const previous = [...remaining].sort((a,b)=>distance(a,box)-distance(b,box))[0];
    if (previous && distance(previous,box) < Math.max(.09,box.width*.85)) {
      remaining.delete(previous);
      return {...box,id:previous.id,seen:now};
    }
    return {...box,id:++nextId,seen:now};
  });
  faceCount = boxes.length;
  faceDetections = [...next,...[...remaining].filter(face=>now-face.seen<850)];
  if (faceCount !== observedCount) {
    observedCount = faceCount;
    countSince = now;
  } else if (faceCount && now-countSince > 550) stableCount = faceCount;
}
function detect(now) {
  if (video.readyState < 2 || lastFrame === video.currentTime) return;
  lastFrame = video.currentTime;
  if (now-lastFace > 230) {
    updateFaces(now);
    lastFace = now;
  }
  const landmarks = hands.detectForVideo(video,now).landmarks;
  const available = new Set(tracks.filter(track=>now-track.seen<650));
  const paired = new Map();
  const unassigned = [];
  for (const points of landmarks) {
    const wrist = points[0];
    const nearest = faceDetections.filter(face=>now-face.seen<450).sort((a,b)=>
      Math.abs(a.x-wrist.x)-Math.abs(b.x-wrist.x))[0];
    if (!nearest) {
      unassigned.push({points});
      continue;
    }
    const score = Math.abs(nearest.x-wrist.x);
    if (!paired.has(nearest.id) || paired.get(nearest.id).score > score) {
      paired.set(nearest.id,{points,face:nearest,score});
    }
  }
  const selected = [...paired.values(),...unassigned].slice(0,Number(people.value)||3);
  const nextTracks = [];
  for (const {points,face} of selected) {
    const wrist = points[0];
    const candidates = [...available].filter(track=>!face || track.faceId === face.id || track.faceId == null);
    const previous = candidates.sort((a,b)=>distance(a.wrist,wrist)-distance(b.wrist,wrist))[0];
    const track = previous && distance(previous.wrist,wrist)<.24 ? previous : {id:++nextId,pose:null,path:[]};
    available.delete(track);
    track.wrist = wrist;
    track.faceId = face?.id ?? track.faceId;
    track.seen = now;
    watch(track,points,now,face);
    nextTracks.push(track);
  }
  tracks = [...nextTracks,...available];
  status.textContent = faceCount+' 人 · '+selected.length+' 只手'+(roundCount?' · 本轮 '+roundCount+' 人':'');
}
let lastDetection = -Infinity;
function stop() {
  active = false;
  stream?.getTracks().forEach(track=>track.stop());
  stream = null;
  video.srcObject = null;
  video.hidden = true;
  byId('roomNote').hidden = false;
  camera.textContent = '打开相机';
  status.textContent = '雪景预览';
}
async function openCamera() {
  if (active) { stop(); return; }
  camera.disabled = true;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('secure');
    status.textContent = '等待相机权限…';
    stream = await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
    video.srcObject = stream;
    video.hidden = false;
    byId('roomNote').hidden = true;
    await video.play();
    status.textContent = '加载手势识别…';
    if (!hands || !faces) {
      const {FilesetResolver,HandLandmarker,FaceDetector} = await import(version+'/vision_bundle.mjs');
      const wasm = await FilesetResolver.forVisionTasks(version+'/wasm');
      hands ??= await HandLandmarker.createFromOptions(wasm,{
        baseOptions:{modelAssetPath:models+'/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},
        runningMode:'VIDEO',numHands:3,minHandDetectionConfidence:.45,minHandPresenceConfidence:.45
      });
      faces ??= await FaceDetector.createFromOptions(wasm,{
        baseOptions:{modelAssetPath:models+'/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'},
        runningMode:'VIDEO',minDetectionConfidence:.48
      });
    }
    reset();
    faceDetections = [];
    faceCount = stableCount = observedCount = 0;
    lastFrame = -1;
    lastFace = -Infinity;
    active = true;
    byId('guide').open = false;
    camera.textContent = '关闭相机';
    cue.textContent = '伸出食指，画一个从上到下的 Z';
  } catch (error) {
    stop();
    console.error(error);
    status.textContent = error.message === 'secure' ? '请用 HTTPS 网页打开' :
      error.name === 'NotAllowedError' ? '请允许 Safari 使用相机' : '相机或识别加载失败，可重新打开';
  } finally {
    camera.disabled = false;
  }
}
camera.onclick = openCamera;
addEventListener('pagehide',stop);
function ellipse(x,y,rx,ry,color) {
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fill();
}
function shape(color, draw) {
  ctx.fillStyle = color;
  ctx.beginPath();
  draw();
  ctx.closePath();
  ctx.fill();
}
function star(x,y,size,color) {
  shape(color,()=>{
    for(let i=0;i<10;i++) {
      const angle=i*Math.PI/5-Math.PI/2, r=i%2?size*.47:size;
      ctx.lineTo(x+Math.cos(angle)*r,y+Math.sin(angle)*r);
    }
  });
}
function pigment(seed) {
  let state = seed;
  return () => {
    state = (Math.imul(state,1664525) + 1013904223) >>> 0;
    return state / 4294967296;
  };
}
function brush(color, width, draw) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  draw();
  ctx.stroke();
}
function wash(x,y,rx,ry,light,dark,tilt=0) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(tilt);
  ctx.scale(rx,ry);
  const gradient=ctx.createRadialGradient(-.30,-.35,.04,.06,.10,1.03);
  gradient.addColorStop(0,light);
  gradient.addColorStop(.76,dark);
  gradient.addColorStop(1,dark);
  ellipse(0,0,1,1,gradient);
  ctx.restore();
}
const painted = new Map();
function illustration(key, draw) {
  if (!painted.has(key)) {
    const surface = document.createElement('canvas');
    surface.width = 360;
    surface.height = 440;
    const screen = ctx;
    ctx = surface.getContext('2d');
    try {
      ctx.setTransform(2,0,0,2,180,392);
      draw();
      const random = pigment(41);
      ctx.globalCompositeOperation = 'source-atop';
      for (let i=0;i<5200;i++) {
        const x=random()*180-90,y=random()*220-196;
        const light = random()>.46;
        ctx.fillStyle = light ? '#fff7e92a' : '#62424a17';
        ctx.fillRect(x,y,.25+random()*1.25,.25+random()*.85);
      }
      painted.set(key,surface);
    } finally {
      ctx = screen;
    }
  }
  ctx.drawImage(painted.get(key),-90,-196,180,220);
}
function gift(x,y,size,color) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(x<0?-.08:.07);
  shape(color,()=>{
    ctx.moveTo(-size/2,-size*.8);
    ctx.lineTo(size*.46,-size*.84);
    ctx.lineTo(size*.52,-size*.06);
    ctx.quadraticCurveTo(size*.05,size*.04,-size*.47,-size*.01);
  });
  brush('#fff2d7',2.7,()=>{
    ctx.moveTo(-1,-size*.76);ctx.quadraticCurveTo(1,-size*.4,0,0);
    ctx.moveTo(-size*.46,-size*.54);ctx.quadraticCurveTo(0,-size*.58,size*.47,-size*.55);
  });
  brush('#fff0d3',1.7,()=>{
    ctx.moveTo(0,-size*.77);ctx.bezierCurveTo(-15,-size-6,-13,-size*.65,0,-size*.77);
    ctx.bezierCurveTo(13,-size-8,12,-size*.68,0,-size*.77);
  });
  ctx.restore();
}
function tree() {
  illustration('tree',()=>{
    const random=pigment(68);
    wash(0,-13,7,15,'#c59c83','#967264');
    const inks=['#678f83','#8bb2a0','#afd0b4','#cce1c1','#789e90','#b6d6be'];
    for(let tier=0;tier<5;tier++){
      const y=-18-tier*26,width=60-tier*10;
      wash(1,y-9,width*.84,21,'#bdd8bd','#8fb6a36b',-.04);
      for(let i=0;i<38;i++){
        const direction=i%2===0?-1:1;
        const a=random(), reach=(.18+random()*.82)*width;
        const origin=y-23-a*10;
        const end=y+random()*12-5;
        brush(inks[Math.floor(random()*inks.length)],.65+random()*2.3,()=>{
          ctx.moveTo(direction*random()*7,origin);
          ctx.quadraticCurveTo(direction*reach*.52,end-7,direction*reach,end);
        });
      }
      for(let i=0;i<13;i++){
        const x=(random()-.5)*width*1.75, dy=random()*10;
        brush('#f4f4dcab',.55+random()*1.3,()=>{
          ctx.moveTo(x,y+dy-6);ctx.quadraticCurveTo(x+2,y+dy-8,x+4,y+dy-5);
        });
      }
    }
    brush('#c3d9bb',2,()=>{ctx.moveTo(2,-129);ctx.quadraticCurveTo(3,-144,-2,-157);});
    for (const [left,right,y] of [[-48,43,-28],[-34,32,-56],[-21,21,-83]]){
      brush('#fff1ceac',1.25,()=>{
        ctx.moveTo(left,y-5);ctx.quadraticCurveTo(4,y+13,right,y-8);
      });
    }
    const baubles=[['#fff5d8','#dfb06b'],['#fff0ed','#d88da3'],['#fefbf0','#d2dac1']];
    [[-44,-29],[38,-31],[-25,-57],[12,-28],[27,-61],[-16,-93],[8,-79],[1,-116]].forEach(([x,y],i)=>{
      const [light,dark]=baubles[i%3];
      wash(x,y,4.4,4.7,light,dark,.18);
      ellipse(x-1,y-1.5,.9,1,'#fff9ed');
    });
    gift(-35,4,21,'#c78da5');
    gift(37,3,17,'#87b5a5');
  });
}
function faceMarks(spread,y) {
  for(const side of [-1,1]){
    brush('#634b49',1.5,()=>{
      ctx.moveTo(side*spread-.9,y+.2);ctx.quadraticCurveTo(side*spread,y-2,side*spread+1,y);
    });
    ctx.save();
    ctx.globalAlpha=.65;
    wash(side*(spread+5),y+5,4.2,2.5,'#f8b4b6','#e68c9977');
    ctx.restore();
  }
}
function santa() {
  illustration('santa',()=>{
    wash(0,-15,24,18,'#e8a2af','#b75974',-.11);
    wash(-16,-18,9,7,'#edabb3','#b95e78',.3);
    wash(13,-16,9,7,'#d78a9b','#b95e78',-.4);
    wash(-8,-3,8,4,'#876173','#654958');
    wash(10,-3,8,4,'#876173','#654958');
    wash(-1,-46,20,18,'#ffe7cd','#e9b59e');
    for(const [x,y,rx,ry] of [[-16,-42,8,13],[15,-43,8,12],[-10,-34,11,10],[4,-32,13,11],[12,-36,9,9]]){
      wash(x,y,rx,ry,'#fffdf2','#e8d6d3');
    }
    const red=ctx.createLinearGradient(-23,-84,24,-60);
    red.addColorStop(0,'#b7627d');
    red.addColorStop(.48,'#e7a0ae');
    red.addColorStop(1,'#bd6380');
    shape(red,()=>{
      ctx.moveTo(-24,-58);
      ctx.bezierCurveTo(-19,-73,-5,-91,12,-88);
      ctx.quadraticCurveTo(24,-89,26,-76);
      ctx.quadraticCurveTo(13,-82,16,-57);
    });
    brush('#984f6770',1,()=>{ctx.moveTo(-23,-59);ctx.bezierCurveTo(-17,-77,0,-93,15,-86);});
    wash(-3,-59,23,5.5,'#fffcec','#e8d7d4',-.07);
    wash(25,-76,6,6.5,'#fffcec','#e7d6d1');
    faceMarks(7,-48);
    wash(0,-44,3.8,2.9,'#f6bfac','#db9c90');
    gift(22,2,18,'#90b5a7');
  });
}
function deer() {
  illustration('deer',()=>{
    for(const side of [-1,1]) {
      brush('#986e62',2.3,()=>{
        ctx.moveTo(side*11,-55);ctx.bezierCurveTo(side*16,-63,side*13,-73,side*20,-84);
        ctx.moveTo(side*16,-69);ctx.quadraticCurveTo(side*24,-72,side*27,-79);
        ctx.moveTo(side*17,-74);ctx.lineTo(side*13,-80);
      });
      brush('#e9bf9b',.55,()=>{ctx.moveTo(side*12,-57);ctx.quadraticCurveTo(side*15,-68,side*19,-80);});
      wash(side*20,-52,10,5,'#e5b797','#aa7864',side*-.34);
      wash(side*23,-52,5,2.25,'#eeb7ad','#d99c9d',side*-.34);
    }
    wash(1,-16,20,14,'#e5bb99','#b1806c',.14);
    wash(-8,-3,5,4,'#a0756b','#785b56');
    wash(9,-3,5,4,'#a0756b','#785b56');
    wash(0,-45,20,20,'#f1caa6','#b98a72',-.07);
    wash(0,-36,11,7,'#fbe5cb','#e2b59a');
    faceMarks(8,-46);
    wash(0,-39,4.4,3,'#e99ea6','#a74868');
    ellipse(-1,-40,.85,.65,'#fff0dd');
    brush('#bd738e',4.4,()=>{ctx.moveTo(-12,-22);ctx.quadraticCurveTo(1,-16,13,-21);});
    brush('#ce8ea2',4.6,()=>{ctx.moveTo(7,-19);ctx.quadraticCurveTo(13,-14,12,-9);});
    const random=pigment(94);
    for(let i=0;i<8;i++) ellipse(random()*17-8.5,-60+random()*8,.65,.45,'#fff0d0ae');
  });
}
function pop(name,x,y,draw,now,scale=1) {
  const effect=effects.get(name);
  if(!effect) return;
  const t=clamp((now-effect.time)/450,0,1);
  ctx.save();
  ctx.translate(x,y+(1-t)*19);
  const zoom=(1-Math.pow(1-t,3))*(1+.12*Math.sin(t*Math.PI))*scale;
  ctx.scale(zoom,zoom);
  draw();
  ctx.restore();
}
const flakes=Array.from({length:64},()=>[Math.random(),Math.random(),Math.random(),Math.random()]);
function render(now) {
  if (active && now-lastDetection > 65) {
    lastDetection=now;
    try { detect(now); } catch(error) {
      console.error(error);
      stop();
      status.textContent='识别中断 · 请重新打开相机';
    }
  }
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  const width=Math.round(w*dpr),height=Math.round(h*dpr);
  if (canvas.width!==width || canvas.height!==height) {
    canvas.width=width;
    canvas.height=height;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const ground=h*.88, scale=Math.min(w/195,h/212);
  const hasScene=effects.has('tree')||effects.has('santa')||effects.has('deer');
  if(hasScene) {
    ctx.save();
    ctx.translate(w/2,ground+12);
    ctx.scale(w*.45,23*scale);
    const snowWash = ctx.createRadialGradient(.04,-.18,.08,0,0,1);
    snowWash.addColorStop(0,'#fff7e8d9');
    snowWash.addColorStop(.53,'#fae5ed86');
    snowWash.addColorStop(1,'#fbe9ee00');
    ellipse(0,0,1,1,snowWash);
    ctx.restore();
  }
  pop('tree',w/2,ground,tree,now,scale);
  pop('santa',w*.16,ground+7,santa,now,scale*.68);
  pop('deer',w*.84,ground+9,deer,now,scale*.69);
  const top=ground-165*scale;
  const starEffect=effects.get('star');
  if(starEffect) {
    const t=clamp((now-starEffect.time)/670,0,1);
    const origin=starEffect.point??{x:.5,y:.38};
    const x=origin.x*w+(w/2-origin.x*w)*t;
    const y=origin.y*h+(top-origin.y*h)*t-Math.sin(t*Math.PI)*20;
    const glow=ctx.createRadialGradient(x,y,0,x,y,21*scale);
    glow.addColorStop(0,'#fff2c4b8');
    glow.addColorStop(1,'#fff2c400');
    ellipse(x,y,21*scale,21*scale,glow);
    star(x,y,11*scale,'#f4d593');
    star(x-.7*scale,y-.7*scale,7*scale,'#fff4cb');
  }
  ctx.lineWidth=2;
  ctx.lineCap='round';
  ctx.strokeStyle='#d1eee3';
  for (const track of tracks) {
    const path=track.path.filter(p=>now-p.now<2200);
    if(!path.length || now-track.seen>220 || effects.has('tree')) continue;
    ctx.beginPath();
    for(const point of path) ctx.lineTo(point.x*w,point.y*h);
    ctx.stroke();
    const end=path[path.length-1];
    star(end.x*w,end.y*h,6,'#fff4ce');
  }
  sparks=sparks.filter(spark=>now-spark.time<760);
  for(const {point,time} of sparks) {
    const t=(now-time)/760;
    for(let i=0;i<12;i++) {
      const angle=i*Math.PI/6, radius=(12+49*t)*(i%2?.6:1);
      ellipse(point.x*w+Math.cos(angle)*radius,point.y*h+Math.sin(angle)*radius,3*(1-t),3*(1-t),'#fff8ed');
    }
  }
  const snow=effects.has('snow');
  flakes.slice(0,snow?64:(active?0:16)).forEach(([x,y,r,s])=>{
    const speed=snow?.000065:.000025;
    const xx=x*w+9*Math.sin(now*.001+y*12);
    const yy=((y+now*speed*(.45+s))%1)*h;
    ellipse(xx,yy,1+r*2.2,1+r*2.2,snow?'#fffdf4e8':'#fffaf2c9');
  });
  if(!active && !hasScene) {
    ctx.save();
    ctx.translate(w/2,ground);
    ctx.scale(scale*.95,scale*.95);
    tree();
    star(0,-166,13,'#f9d486');
    ctx.restore();
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
