<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>yiyang’s Christmas Fantasy · V1.6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7f3;color:#544048;font-family:system-ui,sans-serif}
main{width:min(100%,510px);margin:auto;padding:14px 14px max(18px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}h1{line-height:1.05;font:italic clamp(19px,5.65vw,30px) Georgia;margin:0;color:#654858}small{font-size:11px}
main{width:min(100%,510px,calc(40svh + 28px))}
.stage{position:relative;overflow:hidden;border-radius:18px;aspect-ratio:9/16;box-shadow:0 10px 32px #805f722a;background:#f2e5df}
.snowfield,.room{position:absolute;left:0;right:0;overflow:hidden}
.snowfield{top:0;height:60%;background:radial-gradient(ellipse at 48% 39%,#fffdf1 6%,transparent 64%),linear-gradient(160deg,#e7e4f2,#faeef0 55%,#dfede2)}
.room{top:60%;bottom:0;background:radial-gradient(ellipse at 50% 65%,#fdf3e7,#e8cdd5);box-shadow:inset 0 3px 10px #5934472b}
.stage::after{content:"";position:absolute;top:60%;left:0;right:0;height:6px;transform:translateY(-50%);background:linear-gradient(#fff5e2,#e5c5b9);box-shadow:0 2px 5px #53384233;pointer-events:none}
video,canvas{position:absolute;width:100%;height:100%;inset:0}video{object-fit:cover;object-position:50% 44%;transform:scaleX(-1)}canvas{pointer-events:none}
.room-note{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#775968;font-size:13px;padding:12px}.room-note[hidden]{display:none}
.readout{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 9px;min-height:22px;margin:8px 1px 0;font-size:12px}.status{font-weight:650}.cue:empty{display:none}
.controls,.practice{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}button,select{border:1px solid #ead7de;border-radius:20px;background:#fffdf8;color:inherit;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer}button:disabled{opacity:.55}.primary{background:#754e64;color:white;border-color:#754e64}details{margin:10px 3px;font-size:13px}summary{cursor:pointer}li{margin:5px 0}


.guide{margin:0 0 12px;border:1px solid #ead7de;border-radius:18px;background:#fffcf7;overflow:hidden}
.guide summary{padding:10px 13px;font-weight:650;list-style-position:inside}
.guide-body{padding:0 12px 12px}.languages{display:flex;gap:5px;margin:0 0 10px}
.languages button[aria-pressed="true"]{color:white;background:#754e64;border-color:#754e64}
.guide h2{font-size:14px;margin:12px 0 6px}.guide p{margin:5px 0;line-height:1.5}
.guide ol{margin:6px 0;padding-inline-start:24px;line-height:1.45}
.cast{display:grid;gap:6px}.cast div{border-radius:12px;background:#f4eee9;padding:6px 9px}
.cast div:nth-child(2){background:#eaf4eb}.cast div:nth-child(3){background:#f6e9ef}
.cast dt{font-weight:700}.cast dd{margin:2px 0 0;line-height:1.5}

.gift-target{position:absolute;top:88%;width:44px;height:44px;padding:0;transform:translate(-50%,-62%);border:0;background:transparent;border-radius:8px}
.gift-target:focus-visible{outline:2px solid #b47d9a;outline-offset:-4px}
.gift-target[hidden],.gift-surprise[hidden]{display:none}
.gift-target[data-box="0"]{left:25%}.gift-target[data-box="1"]{left:42%}
.gift-target[data-box="2"]{left:58%}.gift-target[data-box="3"]{left:75%}
.gift-surprise{position:absolute;top:14%;width:24%;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(24px,8vw,48px);background:#fff7e9;border:3px solid #fffaf0;border-radius:48% 46% 43% 47%;box-shadow:0 3px 13px #8f687350;pointer-events:none;animation:gift-pop .55s cubic-bezier(.2,1.45,.6,1) both}
.gift-surprise[data-box="0"]{left:4%;rotate:-8deg}.gift-surprise[data-box="1"]{right:4%;rotate:8deg}
.gift-surprise[data-box="2"]{left:5%;top:44%;rotate:6deg}.gift-surprise[data-box="3"]{right:5%;top:44%;rotate:-6deg}
.gift-surprise img{width:100%;height:100%;object-fit:cover;border-radius:inherit;min-height:0}
@keyframes gift-pop{from{opacity:0;transform:translateY(110%) scale(.18)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<main>
<header><h1>yiyang’s Christmas Fantasy</h1><small>V1.6</small></header>
<details class="guide" id="guide" open>
<summary id="guideTitle">How to Play · 使用指南</summary>
<div class="guide-body">
<div class="languages" role="group" aria-label="Guide language">
<button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="true">中文</button>
<button type="button" data-language="ja" lang="ja" aria-pressed="false">日本語</button>
<button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
</div>
<section id="guideContent"></section>
</div>
</details>
<div class="stage">
<div class="snowfield">
<canvas id="art" aria-label="圣诞雪景"></canvas>
<button class="gift-target" id="gift0" data-box="0" type="button" aria-label="打开玫瑰粉礼物" aria-expanded="false"></button>
<button class="gift-target" id="gift1" data-box="1" type="button" aria-label="打开薄荷绿礼物" aria-expanded="false"></button>
<button class="gift-target" id="gift2" data-box="2" type="button" aria-label="打开香草金礼物" aria-expanded="false"></button>
<button class="gift-target" id="gift3" data-box="3" type="button" aria-label="打开雾紫色礼物" aria-expanded="false"></button>
<div class="gift-surprise" id="surprise0" data-box="0" hidden>🐰</div>
<div class="gift-surprise" id="surprise1" data-box="1" hidden>🐻</div>
<div class="gift-surprise" id="surprise2" data-box="2" hidden>🎀</div>
<div class="gift-surprise" id="surprise3" data-box="3" hidden>🐱</div>
</div>
<div class="room">
<div id="roomNote" class="room-note">打开相机后，你们会出现在这里</div>
<video id="video" playsinline muted hidden></video>
</div>
</div>
<div class="readout">
<div id="status" class="status" role="status">雪景预览</div>
<div id="cue" class="cue" aria-live="polite">用一只手画出你的圣诞节</div>
</div>
<div class="controls">
<button id="camera" class="primary">打开相机</button>
<select id="people" aria-label="拍摄人数"><option value="auto">自动人数</option><option value="1">1 人</option><option value="2">2 人</option><option value="3">3 人</option></select>
<button id="reset">重拍</button>
<button type="button" id="choosePhotos">选礼物照片</button>
<input type="file" id="photos" accept="image/*" multiple hidden>
</div>
<details>
<summary>特效预览</summary>
<div class="practice">
<button data-effect="tree">🎄 画树</button><button data-effect="santa">🎅 老人</button><button data-effect="deer">🦌 驯鹿</button><button data-effect="star">⭐ 点灯</button><button data-effect="snow">❄️ 下雪</button>
</div>

</details>
</main>
<script type="module">
const byId = id => document.getElementById(id);
const video = byId('video'), canvas = byId('art');
let ctx = canvas.getContext('2d');
const camera = byId('camera'), status = byId('status'), cue = byId('cue'), people = byId('people');
const guideCopy = {
  'zh-CN': {

      ['3 人 · 左、中、右','中间画树和点星，左边比赞叫出圣诞老人，右边比 V 叫出驯鹿。三人各撒一次雪。']
    ],
    layout:'上方 60% 是窗外雪景，下方 40% 是人像。三人拍摄时并排站，稍微退后一点，让所有脸都落在窗框下方。',

    gestureTitle:'六个手势',
    gestures:[
      '🎄 圣诞树｜伸出食指，从上往下画一个大 Z。',

      '🦌 驯鹿｜每个人比 V，停半拍，就能叫来一只自己的小鹿。',
      '⭐ 星星｜树出现后，用拇指和食指捏一下。',
      '❄️ 飘雪｜树出现后，张开手掌约 0.3 秒。第一人就会落雪，每多一人撒雪会更密。',
      '🎁 礼物｜树出现后，在胸前轻轻握拳约半秒。松开再握，就会打开下一盒。'
    ],
    record:'想保存视频，可以用 iPhone 的屏幕录制。点「重拍」即可再来一轮。小鹿出现后，单伸食指左右移动，它会跟着跑。点树下的礼盒可开合，想换惊喜可以点「选礼物照片」，选最多四张。'
  },
  ja: {
    title:'How to Play · 遊び方',
    castTitle:'1〜3人での撮り方',
    cast:[
      ['1人 · 真ん中に立つ','片手でツリーを描き、親指を立ててサンタ、Vサインでトナカイを呼びます。星を灯したら、手のひらを開いて少し止め、雪を降らせます。'],
      ['2人 · 左右に並ぶ','左の人はツリーと星、右の人はサンタとトナカイを順番に出します。最後に2人がそれぞれ雪のジェスチャーをします。'],
      ['3人 · 左・真ん中・右','真ん中の人はツリーと星、左の人は親指を立ててサンタ、右の人はVサインでトナカイを出します。最後に3人がそれぞれ雪のジェスチャーをします。']
    ],
    layout:'上60％は窓の外の雪景色、下40％はカメラ映像です。3人で撮るときは横に並び、少し下がって全員の顔を下の枠に収めます。',
    setupTitle:'撮影の準備',
    setup:'iPhoneのSafariでページを開き、人数は自動か1〜3人を選びます。「打开相机」をタップし、カメラを許可してください。スマホは縦向きに置き、全員の顔と片手が画面に入るようにします。',
    gestureTitle:'6つのジェスチャー',

      '🎄 ツリー｜人差し指を伸ばし、上から下へ大きくZを描きます。',

      '❄️ 雪｜ツリーが出たら、手のひらを開いて約0.3秒キープ。1人目から雪が降り、参加する人が増えるほど雪が多くなります。',
      '🎁 プレゼント｜ツリーが出たら、胸の前で軽く握りこぶしを作り、約0.5秒キープ。手をゆるめてから、もう一度握ると次の箱が開きます。'
    ],
    record:'動画を残すには、iPhoneの画面収録を使います。「重拍」で最初からやり直せます。トナカイが出たら、人差し指を左右に動かすと追いかけてきます。ツリーの下のプレゼントはタップで開閉できます。「选礼物照片」から写真を4枚まで選べます。'
  },
  en: {
    title:'How to Play',
    castTitle:'How to film with 1–3 people',
    cast:[
      ['1 person · Center','Use one hand to draw the tree, give a thumbs-up, make a V sign, and pinch to light the star. Finish by holding an open palm for snow.'],
      ['2 people · Side by side','Left: draw the tree and light the star. Right: bring out Santa and the reindeer in turn. Finish with one snow gesture each.'],
      ['3 people · Left, center, right','Center: tree and star. Left: thumbs-up for Santa. Right: V sign for the reindeer. Finish with one snow gesture each.']
    ],
    layout:'The snowy scene fills the top 60% and the camera fills the bottom 40%. For three people, stand side by side and take a small step back so every face fits below the windowsill.',
    setupTitle:'Before you film',
    setup:'Open the page in Safari on your iPhone. Choose the automatic head count or select 1, 2, or 3. Tap “打开相机” (Open camera) and allow access. Set your phone upright and keep everyone’s face and one hand each in frame.',
    gestureTitle:'Six gestures',
    gestures:[
      '🎄 Tree | Point with your index finger and draw a big Z from top to bottom.',
      '🎅 Santa | Give a thumbs-up and hold it for a beat.',
      '🦌 Reindeer | Each person can hold a V sign for a beat to summon their own reindeer.',
      '⭐ Star | Once the tree appears, pinch your thumb and index finger together.',
      '❄️ Snow | Once the tree appears, hold an open palm for about 0.3 seconds. Snow starts with the first person and builds with each participant.',
      '🎁 Gifts | Once the tree appears, hold a relaxed fist near your chest for about half a second. Relax your hand, then make another fist to open the next box.'
    ],
    record:'Use iPhone Screen Recording to save your video. Tap “重拍” (Retake) to start a new round. Once the reindeer appears, move one pointing finger sideways to guide it. Tap a gift to open or close it. Use “选礼物照片” to select up to four photos.'
  }
};
const languageButtons = [...document.querySelectorAll('[data-language]')];
function showGuide(language) {
  const copy = guideCopy[language];
  byId('guideTitle').textContent = copy.title;
  byId('guideTitle').lang = language;
  const content = byId('guideContent');
  content.lang = language;
  content.innerHTML = `
    <h2>${copy.castTitle}</h2>
    <dl class="cast">${copy.cast.map(([title,body])=>`<div><dt>${title}</dt><dd>${body}</dd></div>`).join('')}</dl>
    <h2>${copy.setupTitle}</h2><p>${copy.layout}</p><p>${copy.setup}</p>
    <h2>${copy.gestureTitle}</h2><ol>${copy.gestures.map(gesture=>`<li>${gesture}</li>`).join('')}</ol>
    <p>${copy.record}</p>`;
  for (const button of languageButtons) button.setAttribute('aria-pressed',String(button.dataset.language === language));
}
for (const button of languageButtons) button.onclick = () => showGuide(button.dataset.language);
showGuide('zh-CN');

const version = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304';
const models = 'https://storage.googleapis.com/mediapipe-models';
const effects = new Map();
let hands, faces, stream, active = false, tracks = [], roundCount = 0;
let credits = new Set(), sparks = [], pendingStar = false, lastFrame = -1, lastFace = -Infinity, faceCount = 0;
let faceDetections = [], nextId = 0, observedCount = 0, countSince = 0, stableCount = 0;
const reindeer = new Map();
const scarves = ['#d9869b','#83b5a3','#a890bd'];
const deerHomes = [.83,.24,.57];
const messages = {tree:'树长出来啦 · 比赞或比 V 来装饰',santa:'圣诞老人来送礼物了',deer:'小驯鹿找到圣诞树了',star:'星星和树灯都亮啦 · 张掌停一下就能撒雪',snow:'Merry Christmas!'};
const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
function summonDeer(owner,now) {
  const limit = Number(people.value) || (active ? Math.max(1,faceCount,stableCount,roundCount) : 3);
  if (reindeer.has(owner) || reindeer.size >= limit) return;
  const index = reindeer.size;
  const x = deerHomes[index];
  reindeer.set(owner,{index,x,target:x,direction:index===1?1:-1,time:now,guidedUntil:0});
  effects.set('deer',{time:now});
  cue.textContent = '第 ' + (index+1) + ' 只驯鹿来了 · 伸食指左右引导';
}
function trigger(name, point) {
  if (name === 'deer') {
    const previewSlot = deerHomes.findIndex((_,i)=>!reindeer.has('preview'+i));
    if (previewSlot>=0) summonDeer('preview'+previewSlot,performance.now());
    return;
  }
  if (effects.has(name)) return;
  if (name === 'star' && !effects.has('tree')) {
    pendingStar = true;
    cue.textContent = '星星准备好了 · 先用食指画树';
    return;
  }
  effects.set(name, {time:performance.now(),point});
  if (name === 'tree') giftBoxes.forEach(box=>{ box.hidden=false; });
  cue.textContent = messages[name];
  if (name === 'tree') {
    roundCount = Number(people.value) || (faceCount === stableCount ? stableCount : faceCount) || 1;
    if (pendingStar) {
      pendingStar = false;
      trigger('star');
    }
  }
}
function reset() {
  effects.clear();
  tracks = [];
  credits.clear();
  reindeer.clear();
  lastGiftGesture=-Infinity;
  for (let i=0;i<giftBoxes.length;i++) {
    setGift(i,false);
    giftBoxes[i].hidden=active;
  }
  sparks = [];
  pendingStar = false;
  roundCount = 0;
  cue.textContent = '伸出食指，画一个从上到下的 Z';
}

const giftSlots = [
  {x:.25, size:20, color:'#c9829b', ribbon:'#fff1dc', angle:-.10},
  {x:.42, size:24, color:'#80aa98', ribbon:'#fff2d8', angle:.04},
  {x:.58, size:21, color:'#d2aa73', ribbon:'#fff4ec', angle:-.05},
  {x:.75, size:22, color:'#9b8cb7', ribbon:'#ffeadb', angle:.10}
];
const giftBoxes = giftSlots.map((_,i)=>byId('gift'+i));
const surprises = giftSlots.map((_,i)=>byId('surprise'+i));
const photoURLs = giftSlots.map(()=>null);
const surpriseIcons = surprises.map(card=>card.textContent);
const giftOpenedAt = giftSlots.map(()=>0);
let lastGiftGesture = -Infinity;
function setGift(i,open) {
  giftBoxes[i].setAttribute('aria-expanded',String(open));
  surprises[i].hidden = !open;
  giftOpenedAt[i] = open ? performance.now() : 0;
}
for (let i=0;i<giftBoxes.length;i++) giftBoxes[i].onclick=()=>setGift(i,surprises[i].hidden);
const photos=byId('photos');
byId('choosePhotos').onclick=()=>photos.click();
photos.onchange=()=>{
  const files=[...photos.files].slice(0,giftSlots.length);
  if (!files.length) return;
  for (let i=0;i<giftSlots.length;i++) {
    if (photoURLs[i]) URL.revokeObjectURL(photoURLs[i]);
    photoURLs[i]=null;
    surprises[i].textContent=surpriseIcons[i];
    if (!files[i]) continue;
    const image=document.createElement('img');
    const url=URL.createObjectURL(files[i]);
    photoURLs[i]=url;
    image.alt='礼盒照片';
    image.onload=()=>{
      if (photoURLs[i]===url) surprises[i].replaceChildren(image);
    };
    image.onerror=()=>{
      if (photoURLs[i]===url) cue.textContent='这张照片无法显示，可以换一张 JPG 或 PNG';
    };
    image.src=url;
  }
  photos.value='';
  cue.textContent='照片已选 · 握拳或点击礼盒打开';
};

byId('reset').onclick = reset;
people.onchange = reset;
document.querySelectorAll('[data-effect]').forEach(button => button.onclick = () => trigger(button.dataset.effect));

function cover(point) {
  return {x:1-point.x,y:point.y};
}
function fingerUp(points, finger) {
  const [base,joint,tip] = [[2,3,4],[5,6,8],[9,10,12],[13,14,16],[17,18,20]][finger].map(i=>points[i]);
  return distance(tip,base) > 1.37*distance(joint,base) &&
    distance(tip,points[0]) > 1.09*distance(joint,points[0]);
}
function isZ(path) {
  if (path.length < 5) return false;
  const first = path[0], last = path[path.length-1];
  if (last.y-first.y < .079) return false;
  for (const direction of [1,-1]) {
    let peak = first.x * direction;
    let trough = Infinity;
    for (const point of path) {
      const x = point.x * direction;
      if (trough === Infinity) peak = Math.max(peak,x);
      if (peak-first.x*direction > .045 && peak-x > .060) trough = Math.min(trough,x);
      if (x-trough > .042) return true;
    }
  }
  return false;
}
function watch(track, points, now) {
  const wrist = points[0], tip = points[8], thumb = points[4];
  const palm = distance(wrist,points[9]);
  const [index,middle,ring,pinky] = [1,2,3,4].map(i=>fingerUp(points,i));
  const pinched = distance(thumb,tip) < .33*palm;
  const thumbUp = fingerUp(points,0) && thumb.y < points[5].y-.2*palm;
  const fingertips = [8,12,16,20];
  const curled = fingertips.every((end,i)=>distance(points[end],points[[5,9,13,17][i]]) < .61*palm);
  const tucked = distance(thumb,points[5]) < .70*palm;
  let pose = '';
  const longFingers = [8,12,16,20].filter((end,i)=>
    distance(wrist,points[end]) > distance(wrist,points[[5,9,13,17][i]])*1.3).length;
  if ((index && middle && ring && pinky) || (longFingers >= 3 && distance(tip,points[20]) > .65*palm)) pose = 'open';
  else if (!index && !middle && !ring && !pinky && thumbUp) pose = 'santa';
  else if (curled && tucked) pose = 'gift';
  else if (pinched && !middle && !ring && !pinky) pose = 'star';
  else if (index && middle && !ring && !pinky && distance(tip,points[12]) > .21*palm) pose = 'deer';
  else if (index && !middle && !ring && !pinky) pose = 'point';
  const location = cover(tip);
  if (pose !== 'gift') {
    track.giftReleasedAt ??= now;

    mist.addColorStop(0,'#fff5f275');
    mist.addColorStop(1,'#fff5f200');
    ellipse(0,0,1,1,mist);
    ctx.restore();
  }
  const streak=((now+2600)%10500)/10500;
  if(streak<.13){
    const progress=streak/.13, x=w*(.12+.67*progress), y=h*(.09+.14*progress);
    ctx.globalAlpha=Math.sin(Math.PI*progress)*.65;
    brush('#fff5d2',.9,()=>{ctx.moveTo(x-w*.11,y-h*.023);ctx.lineTo(x,y);});
    star(x,y,3.5,'#fff7de');
    ctx.globalAlpha=1;
  }
  for(let i=0;i<8;i++){
    const x=w*(.08+((i*37)%89)/105),y=h*(.12+(i*17%41)/100);
    ctx.globalAlpha=.4+.22*Math.sin(now*.0018+i);
    star(x,y,i%3===0?3.5:1.9,'#fff7df');
  }
  ctx.globalAlpha=1;
}

function render(now) {
  if (active && now-lastDetection > 50) {
    lastDetection=now;
    try { detect(now); } catch(error) {
      console.error(error);
      stop();
      status.textContent='识别中断 · 请重新打开相机';
    }
  }
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  const width=Math.round(w*dpr),height=Math.round(h*dpr);
  if (canvas.width!==width || canvas.height!==height) {
    canvas.width=width;
    canvas.height=height;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  paintScenery(w,h,now);
  const ground=h*.88, scale=Math.min(w/195,h/212);
  const hasScene=effects.has('tree')||effects.has('santa')||effects.has('deer');
  if(hasScene) {
    ctx.save();
    ctx.translate(w/2,ground+12);
    ctx.scale(w*.45,23*scale);
    const snowWash = ctx.createRadialGradient(.04,-.18,.08,0,0,1);
    snowWash.addColorStop(0,'#fff7e8d9');
    snowWash.addColorStop(.53,'#fae5ed86');
    snowWash.addColorStop(1,'#fbe9ee00');
    ellipse(0,0,1,1,snowWash);
    ctx.restore();
  }
  const sway=.029*Math.sin(now*.00165)+.009*Math.sin(now*.0031);
  pop('tree',w/2,ground,()=>{ctx.rotate(sway);tree();},now,scale);
  pop('santa',w*.16,ground+7,santa,now,scale*.68);
  for (const companion of reindeer.values()) {
    const {index}=companion;
    const travel=companion.target-companion.x;
    if (Math.abs(travel)>.006) companion.direction=Math.sign(travel);
    companion.x+=travel*.115;
    const running=Math.abs(travel)>.013;
    const step=running?Math.sin(now*.024+index):0;
    const hop=running?Math.abs(step)*8:Math.max(0,Math.sin(now*.003+index))*1.7;
    pop('deer',w*companion.x,ground+10+(index-1)*6-hop,()=>{
      ctx.save();
      ctx.scale(companion.direction,1);
      if (running) {
        for (const side of [-1,1]) {
          brush('#9c7161',3,()=>{
            ctx.moveTo(side*7,-8);
            ctx.quadraticCurveTo(side*8+step*3,-3,side*10+side*step*8,3-Math.max(0,side*step)*4);
          });
        }
      }
      deer();
      brush(scarves[index],4.6,()=>{
        ctx.moveTo(-12,-22);ctx.quadraticCurveTo(1,-16,13,-21);
        ctx.moveTo(7,-19);ctx.quadraticCurveTo(13,-14,12,-9);
      });
      ctx.restore();
    },now,scale*(.64-index*.065),companion);
  }
  const crownX=w/2+Math.sin(sway)*165*scale;
  const top=ground-Math.cos(sway)*165*scale;
  if (effects.has('tree')) {
    const age=now-effects.get('tree').time;
    if(age<3000){
      const progress=clamp(age/2300,0,1);
      for(let i=0;i<26;i++){
        const height=progress-i*.018;
        if(height<0 || height>1) continue;
        const x=w/2+Math.sin(height*21)*((1-height)*51+4)*scale;
        const y=ground-height*158*scale;
        ctx.globalAlpha=(1-i/26)*clamp((3000-age)/550,0,1);
        ellipse(x,y,(.5+(1-i/26)*1.8)*scale,(.5+(1-i/26)*1.8)*scale,'#fff1bb');
      }
      ctx.globalAlpha=1;
    }
    for (let i=0;i<7;i++) {
      const phase=(now*.00024+i/7)%1;
      const x=crownX+(w/2-crownX)*phase+Math.sin(now*.0017+i*2.1)*(9+65*phase)*scale;
      const y=top+phase*144*scale;
      ctx.globalAlpha=.48*Math.sin(phase*Math.PI);
      star(x,y,(1.8+phase*2)*scale,'#fff5d4');
    }
    ctx.globalAlpha=1;
  }
  const starEffect=effects.get('star');
  if(starEffect) {
    const t=clamp((now-starEffect.time)/670,0,1);
    const origin=starEffect.point??{x:.5,y:.38};
    const x=origin.x*w+(crownX-origin.x*w)*t;
    const y=origin.y*h+(top-origin.y*h)*t-Math.sin(t*Math.PI)*20;
    const glow=ctx.createRadialGradient(x,y,0,x,y,21*scale);
    glow.addColorStop(0,'#fff2c4b8');
    glow.addColorStop(1,'#fff2c400');
    ellipse(x,y,21*scale,21*scale,glow);
    star(x,y,11*scale,'#f4d593');
    star(x-.7*scale,y-.7*scale,7*scale,'#fff4cb');
    if (t>.4) {
      [[-44,-29],[38,-31],[-25,-57],[12,-28],[27,-61],[-16,-93],[8,-79],[1,-116]].forEach(([lx,ly],i)=>{
        const dx=w/2+(lx*Math.cos(sway)-ly*Math.sin(sway))*scale;
        const dy=ground+(lx*Math.sin(sway)+ly*Math.cos(sway))*scale;
        const halo=ctx.createRadialGradient(dx,dy,0,dx,dy,13*scale);
        halo.addColorStop(0,'#fff3c8d9');
        halo.addColorStop(1,'#fff3c800');
        ctx.globalAlpha=.52+.38*Math.sin(now*.004+i*1.72);
        ellipse(dx,dy,13*scale,13*scale,halo);
        ellipse(dx,dy,1.65*scale,1.65*scale,'#fff8dc');
      });
      ctx.globalAlpha=1;
    }
  }
  ctx.lineWidth=2;
  ctx.lineCap='round';
  ctx.strokeStyle='#d1eee3';
  for (const track of tracks) {
    const path=track.path.filter(p=>now-p.now<2450);
    if(!path.length || now-track.seen>220 || effects.has('tree')) continue;
    ctx.beginPath();
    for(const point of path) ctx.lineTo(point.x*w,point.y*h);
    ctx.stroke();
    const end=path[path.length-1];
    star(end.x*w,end.y*h,6,'#fff4ce');
  }
  sparks=sparks.filter(spark=>now-spark.time<760);
  for(const {point,time} of sparks) {
    const t=(now-time)/760;
    for(let i=0;i<12;i++) {
      const angle=i*Math.PI/6, radius=(12+49*t)*(i%2?.6:1);
      ellipse(point.x*w+Math.cos(angle)*radius,point.y*h+Math.sin(angle)*radius,3*(1-t),3*(1-t),'#fff8ed');
    }
  }
  if (effects.has('tree') || !active) {
    giftSlots.forEach((slot,i)=>{
      const age = surprises[i].hidden ? -1 : now-giftOpenedAt[i];
      drawWrappedGift(w*slot.x,ground+5,slot,scale,age);
    });
  }
  const snow=effects.has('snow');
  flakes.slice(0,snow?(credits.size?30+credits.size*11:64):18).forEach(([x,y,r,s])=>{
    const speed=snow?.000054+r*.000047:.000017+r*.000013;
    const xx=x*w+(5+r*13)*Math.sin(now*.00085+y*12);
    const yy=((y+now*speed*(.45+s))%1)*h;
    ellipse(xx,yy,1+r*2.2,1+r*2.2,snow?'#fffdf4e8':'#fffaf2c9');
  });
  if(!active && !hasScene) {
    ctx.save();
    ctx.translate(w/2,ground);
    ctx.scale(scale*.95,scale*.95);
    ctx.rotate(sway);
    tree();
    star(0,-166,13,'#f9d486');
    ctx.restore();
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
